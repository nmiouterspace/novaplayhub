<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="HT Viewer"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="../hometrack/icon.svg"><link rel="apple-touch-icon" href="../hometrack/icon.svg"><title>HomeTrack Viewer</title><style>:root{--bg:#eef4ff;--card:#fff;--text:#172033;--muted:#71809a;--line:#dfe7f4;--blue:#2563eb;--green:#13a66a;--orange:#f59e0b;--shadow:0 18px 50px rgba(27,67,130,.12)}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#eef4ff,#f8fbff);color:var(--text)}.shell{width:min(1320px,100%);margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.brand img{width:54px;height:54px;border-radius:16px}.brand h1{margin:0;font-size:27px}.sub{color:var(--muted);margin-top:3px}.status{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:999px}.dot{width:10px;height:10px;border-radius:50%;background:#94a3b8}.dot.on{background:var(--green);box-shadow:0 0 0 5px rgba(19,166,106,.12)}.dot.warn{background:var(--orange)}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:14px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted)}.row{display:flex;gap:8px}.field input{padding:12px 13px;border:1px solid var(--line);border-radius:12px;font:inherit}.btn{border:0;border-radius:12px;padding:12px 15px;background:var(--blue);color:#fff;font-weight:800}.seg{display:flex;gap:6px;background:#eef3fb;padding:4px;border-radius:14px}.seg button{border:0;border-radius:10px;padding:10px 14px;background:transparent;color:#33415c;font-weight:700}.seg button.active{background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.08)}.map{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fafcff}.map img{display:block;width:100%;height:auto}.marker{position:absolute;transform:translate(-50%,-100%);display:none;z-index:5}.marker.show{display:block}.pin{width:34px;height:34px;border-radius:50% 50% 50% 0;background:var(--blue);transform:rotate(-45deg);display:grid;place-items:center;box-shadow:0 10px 24px rgba(37,99,235,.28)}.pin:after{content:"";width:12px;height:12px;background:#fff;border-radius:50%}.label{margin-top:6px;background:#fff;padding:6px 9px;border-radius:10px;border:1px solid var(--line);font-size:12px;white-space:nowrap;transform:translateX(-18%)}.zones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.zone-chip{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#f8fbff;font-size:13px}.zone-chip.active{border-color:#93c5fd;background:#eff6ff}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f7f9fd;border:1px solid var(--line);border-radius:15px;padding:12px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;margin-top:6px;font-size:17px;word-break:break-word}.notice{margin-top:12px;padding:13px 14px;border-radius:14px;background:#eefbf6;color:#14734f;font-size:13px;line-height:1.5}.notice.warn{background:#fff8e7;color:#805d12}.notice.err{background:#fff0f0;color:#a33838}.link{display:inline-flex;margin-top:12px;text-decoration:none;background:var(--blue);color:#fff;padding:12px 15px;border-radius:13px;font-weight:800}@media(max-width:1000px){.grid{grid-template-columns:1fr}}@media(max-width:560px){.shell{padding:12px}.metrics,.zones{grid-template-columns:1fr 1fr}.brand h1{font-size:22px}}</style></head><body><div class="shell"><header class="top"><div class="brand"><img src="../hometrack/icon.svg"><div><h1>HomeTrack Viewer</h1><div class="sub">Xem vị trí trên đúng sơ đồ nhà</div></div></div><div class="status"><i id="dot" class="dot"></i><span id="statusText">Chưa có dữ liệu</span></div></header><main class="grid"><section class="card"><div class="toolbar"><div class="field"><label>Mã chia sẻ cần xem</label><div class="row"><input id="shareCode" value="HOME-001" maxlength="30"><button class="btn" id="connectBtn">Kết nối</button></div></div><div class="field"><label>Tầng đang xem</label><div class="seg" id="floorSeg"><button data-floor="ground" class="active">Tầng trệt</button><button data-floor="upper">Tầng 1</button></div></div></div><div class="map"><img id="floorImg" alt="Sơ đồ nhà"><div id="marker" class="marker"><div class="pin"></div><div id="markerLabel" class="label">—</div></div></div><div id="zones" class="zones"></div></section><aside class="card"><div class="metrics"><div class="metric"><span>Thiết bị</span><strong id="device">—</strong></div><div class="metric"><span>Mã chia sẻ</span><strong id="code">—</strong></div><div class="metric"><span>Chế độ</span><strong id="mode">—</strong></div><div class="metric"><span>Khu vực</span><strong id="zone">—</strong></div><div class="metric"><span>Độ chính xác GPS</span><strong id="accuracy">—</strong></div><div class="metric"><span>Cập nhật cuối</span><strong id="updated">—</strong></div></div><div id="cloudStatus" class="notice warn">Đang chờ dữ liệu từ Firebase.</div><a class="link" href="../hometrack-tracker-final/">Mở HomeTrack Tracker</a></aside></main></div><script>const DB='https://hometrack-1608-default-rtdb.asia-southeast1.firebasedatabase.app';const IMAGES={ground:'../hometrack/assets/floor_ground.svg',upper:'../hometrack/assets/floor_upper.svg'};const Z={ground:[['GARA','GARA',13,34],['PIANO_TOP','PIANO (trên)',31,24],['TREO_DO','TREO ĐỒ',39,41],['GAM_THANG','GẦM THANG',50,27],['TOILET_G','TOILET',61,26],['DAO_BEP','ĐẢO BẾP',83,33],['TU_LANH','TỦ LẠNH',95,14],['KE_TV','KỆ TV',5,64],['TIVI','TIVI',15,69],['GHE_TRAI','GHẾ (trái)',9,88],['SOFA_DAI','SOFA DÀI',20,88],['GHE_PHAI','GHẾ (phải)',31,88],['PIANO_BOTTOM','PIANO (dưới)',52,71],['BAN_AN','BÀN ĂN',85,77]],upper:[['TOILET_LEFT','TOILET (trái)',10,23],['TU_DO_TOP','TỦ ĐỒ (trên)',31,12],['PHONG_NGU_TRAI','PHÒNG NGỦ TRÁI',22,77],['TU_DO_BOTTOM','TỦ ĐỒ (dưới)',29,62],['TU_SACH','TỦ SÁCH',44,70],['SANH','SẢNH TẦNG 1',58,66],['PHONG_NGU_PHAI','PHÒNG NGỦ PHẢI',81,23],['TOILET_RIGHT','TOILET (phải)',67,79],['BAN_THO','BÀN THỜ',93,78]]};const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let code=localStorage.getItem('htViewerFinalCode')||'HOME-001',floor='ground',last=null,busy=false;$('#shareCode').value=code;function safe(v){return(v.trim()||'HOME-001').replace(/[^A-Za-z0-9_-]/g,'-').slice(0,30)}function setFloor(f){floor=f;$$('#floorSeg button').forEach(b=>b.classList.toggle('active',b.dataset.floor===f));$('#floorImg').src=IMAGES[f];renderZones();renderMarker()}function currentZone(){if(!last||last.mode!=='indoor')return null;return(Z[last.floor]||[]).find(z=>z[0]===last.zoneKey)||null}function renderZones(){const active=last&&last.floor===floor?last.zoneKey:'';$('#zones').innerHTML=Z[floor].map(z=>`<div class="zone-chip ${active===z[0]?'active':''}">${z[1]}</div>`).join('')}function renderMarker(){const m=$('#marker'),z=currentZone();if(!z||last.floor!==floor){m.classList.remove('show');return}m.style.left=z[2]+'%';m.style.top=z[3]+'%';$('#markerLabel').textContent=(last.device||'Thiết bị')+' · '+z[1];m.classList.add('show')}function show(p){if(!p)return false;last=p;$('#device').textContent=p.device||'Thiết bị';$('#code').textContent=p.code||code;$('#mode').textContent=p.mode==='gps'?'GPS ngoài nhà':'Vị trí trong nhà';$('#zone').textContent=p.mode==='gps'?'GPS ngoài nhà':(p.zone||'—');$('#accuracy').textContent=Number.isFinite(p.accuracy)?Math.round(p.accuracy)+' m':'—';$('#updated').textContent=p.time||new Date(p.timestamp||Date.now()).toLocaleTimeString('vi-VN');const online=p.active!==false&&Date.now()-(p.timestamp||0)<15000;$('#dot').className='dot '+(online?'on':'warn');$('#statusText').textContent=online?'Đang nhận vị trí':'Vị trí đã cũ/đã dừng';if(p.mode==='indoor'){setFloor(p.floor||floor);$('#cloudStatus').className='notice';$('#cloudStatus').textContent='Đã nhận vị trí trong nhà từ Firebase và đặt marker trên sơ đồ.'}else{$('#cloudStatus').className='notice warn';$('#cloudStatus').textContent='Tracker đang gửi GPS ngoài nhà nên không đặt marker trong sơ đồ.';renderMarker()}return true}async function poll(){if(busy)return;busy=true;try{const r=await fetch(`${DB}/trackers/${encodeURIComponent(code)}.json?ts=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error();const p=await r.json();if(!show(p)){$('#statusText').textContent='Chưa có dữ liệu';$('#dot').className='dot';$('#cloudStatus').className='notice warn';$('#cloudStatus').textContent='Chưa tìm thấy Tracker mang mã '+code+'.';last=null;renderMarker();renderZones()}}catch{$('#statusText').textContent='Lỗi Firebase';$('#dot').className='dot';$('#cloudStatus').className='notice err';$('#cloudStatus').textContent='Không đọc được Firebase. Kiểm tra Internet hoặc Database Rules.'}finally{busy=false}}$('#connectBtn').onclick=()=>{code=safe($('#shareCode').value);$('#shareCode').value=code;localStorage.setItem('htViewerFinalCode',code);poll()};$('#shareCode').onkeydown=e=>{if(e.key==='Enter')$('#connectBtn').click()};$('#floorSeg').onclick=e=>{if(e.target.dataset.floor)setFloor(e.target.dataset.floor)};setFloor('ground');setInterval(poll,1000);poll();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));</script></body></html>
