<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><title>HomeTrack Viewer Clean</title><style>:root{--bg:#eef4ff;--card:#fff;--text:#172033;--muted:#71809a;--line:#dfe7f4;--blue:#2563eb;--green:#13a66a;--orange:#f59e0b;--red:#dc4c4c;--shadow:0 18px 50px rgba(27,67,130,.12)}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#eef4ff,#f8fbff);color:var(--text);min-height:100vh}.shell{width:min(1360px,100%);margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:54px;height:54px;border-radius:16px;box-shadow:var(--shadow)}h1{margin:0;font-size:28px}.sub{margin-top:4px;color:var(--muted)}.status{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;border:1px solid var(--line);border-radius:999px;font-size:13px}.dot{width:10px;height:10px;border-radius:50%;background:#94a3b8}.dot.on{background:var(--green);box-shadow:0 0 0 5px rgba(19,166,106,.12)}.dot.warn{background:var(--orange)}.dot.err{background:var(--red)}.grid{display:grid;grid-template-columns:1.4fr .6fr;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted)}.field input{padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit}.field-row{display:flex;gap:8px}.seg{display:flex;gap:6px;background:#eef3fb;padding:4px;border-radius:14px}.seg button{padding:10px 14px;background:transparent;color:#33415c;border:0;border-radius:12px;font-weight:800;cursor:pointer}.seg button.active{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06)}.cta{border:0;border-radius:12px;padding:12px 15px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.map-stage{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fafcff}.map-stage img{display:block;width:100%;height:auto}.marker{position:absolute;transform:translate(-50%,-100%);display:none;z-index:5}.marker.show{display:block}.pin{width:34px;height:34px;border-radius:50% 50% 50% 0;background:var(--blue);transform:rotate(-45deg);display:grid;place-items:center;box-shadow:0 10px 24px rgba(37,99,235,.25)}.pin:after{content:"";width:12px;height:12px;background:#fff;border-radius:50%}.marker-label{margin-top:6px;background:rgba(255,255,255,.96);padding:6px 9px;border-radius:10px;border:1px solid var(--line);font-size:12px;white-space:nowrap;transform:translateX(-18%)}.zone-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.zone-chip{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#f8fbff;font-size:13px}.zone-chip.active{border-color:#93c5fd;background:#eff6ff}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f7f9fd;border:1px solid var(--line);border-radius:15px;padding:12px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;margin-top:6px;font-size:16px;word-break:break-word}.notice{margin-top:12px;padding:13px 14px;border-radius:14px;background:#eefbf6;color:#14734f;font-size:13px;line-height:1.5}.notice.warn{background:#fff8e7;color:#805d12}.notice.err{background:#fff0f0;color:#a33838}@media(max-width:1000px){.grid{grid-template-columns:1fr}}@media(max-width:520px){.zone-list{grid-template-columns:1fr}.shell{padding:12px}}</style></head><body><div class="shell"><header class="top"><div class="brand"><img src="../hometrack/icon.svg"><div><h1>HomeTrack Viewer</h1><div class="sub">Bản clean · dùng sơ đồ nhà thật</div></div></div><div class="status"><i id="dot" class="dot"></i><span id="statusText">Chưa có dữ liệu</span></div></header><main class="grid"><section class="card"><div class="toolbar"><div class="field"><label>Mã chia sẻ cần xem</label><div class="field-row"><input id="shareCode" value="HOME-01" maxlength="30"><button class="cta" id="connectBtn">Kết nối</button></div></div><div class="field"><label>Tầng đang xem</label><div class="seg" id="floorSeg"><button data-floor="ground" class="active">Tầng trệt</button><button data-floor="upper">Tầng 1</button></div></div></div><div class="map-stage"><img id="floorImg" alt="Sơ đồ nhà"><div id="marker" class="marker"><div class="pin"></div><div id="markerLabel" class="marker-label">—</div></div></div><div id="zoneList" class="zone-list"></div></section><aside class="card"><div class="metrics"><div class="metric"><span>Thiết bị</span><strong id="device">—</strong></div><div class="metric"><span>Mã chia sẻ</span><strong id="code">—</strong></div><div class="metric"><span>Chế độ</span><strong id="mode">—</strong></div><div class="metric"><span>Khu vực</span><strong id="zone">—</strong></div><div class="metric"><span>Độ chính xác</span><strong id="accuracy">—</strong></div><div class="metric"><span>Cập nhật cuối</span><strong id="updated">—</strong></div></div><div id="cloudStatus" class="notice warn">Đang chờ dữ liệu từ Firebase.</div></aside></main></div><script>const DB='https://hometrack-1608-default-rtdb.asia-southeast1.firebasedatabase.app';const IMAGES={ground:'../hometrack/assets/floor_ground.svg?clean=20260808a',upper:'../hometrack/assets/floor_upper.svg?clean=20260808a'};const Z={ground:[['GARA','GARA',12,33],['PIANO_TOP','PIANO (trên)',31,24],['TREO_DO','TREO ĐỒ',38,42],['GAM_THANG','GẦM THANG',49,29],['TOILET_G','TOILET',60,28],['DAO_BEP','ĐẢO BẾP',84,35],['TU_LANH','TỦ LẠNH',95,14],['KE_TV','KỆ TV',4,66],['TIVI','TIVI',16,69],['GHE_TRAI','GHẾ (trái)',9,90],['SOFA_DAI','SOFA DÀI',20,90],['GHE_PHAI','GHẾ (phải)',30,90],['PIANO_BOTTOM','PIANO (dưới)',52,72],['BAN_AN','BÀN ĂN',86,78]],upper:[['TOILET_LEFT','TOILET (trái)',10,22],['TU_DO_TOP','TỦ ĐỒ (trên)',29,11],['PHONG_NGU_TRAI','PHÒNG NGỦ TRÁI',23,76],['TU_DO_BOTTOM','TỦ ĐỒ (dưới)',29,59],['TU_SACH','TỦ SÁCH',44,70],['SANH','SẢNH TẦNG 1',56,70],['PHONG_NGU_PHAI','PHÒNG NGỦ PHẢI',81,22],['TOILET_RIGHT','TOILET (phải)',68,81],['BAN_THO','BÀN THỜ',94,79]]};const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let code=localStorage.getItem('cleanViewerCode')||'HOME-01',floor='ground',last=null,busy=false;$('#shareCode').value=code;function setFloor(f){floor=f;$$('#floorSeg button').forEach(b=>b.classList.toggle('active',b.dataset.floor===f));$('#floorImg').src=IMAGES[f];renderZones();renderMarker()}function renderZones(){const active=last&&last.floor===floor?last.zoneKey:'';$('#zoneList').innerHTML=(Z[floor]||[]).map(z=>`<div class="zone-chip ${active===z[0]?'active':''}">${z[1]}</div>`).join('')}function renderMarker(){const m=$('#marker');if(!last||last.mode!=='indoor'){m.classList.remove('show');return}const z=(Z[last.floor]||[]).find(v=>v[0]===last.zoneKey);if(!z||last.floor!==floor){m.classList.remove('show');return}m.style.left=z[2]+'%';m.style.top=z[3]+'%';$('#markerLabel').textContent=(last.device||'Thiết bị')+' · '+z[1];m.classList.add('show')}function show(p){if(!p)return false;last=p;$('#device').textContent=p.device||'Thiết bị';$('#code').textContent=p.code||code;$('#mode').textContent=p.mode==='gps'?'GPS ngoài nhà':'Vị trí trong nhà';$('#zone').textContent=p.mode==='gps'?'GPS ngoài nhà':(p.zone||'—');$('#accuracy').textContent=Number.isFinite(p.accuracy)?Math.round(p.accuracy)+' m':'—';$('#updated').textContent=p.time||new Date(p.timestamp||Date.now()).toLocaleTimeString('vi-VN');const online=p.active!==false&&Date.now()-(p.timestamp||0)<20000;$('#dot').className='dot '+(online?'on':'warn');$('#statusText').textContent=online?'Đang nhận vị trí':'Vị trí đã cũ/đã dừng';if(p.mode==='indoor'){setFloor(p.floor||floor);$('#cloudStatus').className='notice';$('#cloudStatus').textContent='Đã nhận vị trí trong nhà và đặt marker đúng trên sơ đồ.'}else{$('#cloudStatus').className='notice warn';$('#cloudStatus').textContent='Tracker đang gửi GPS ngoài nhà nên không gắn marker trong sơ đồ.';renderMarker()}return true}async function poll(){if(busy)return;busy=true;try{const r=await fetch(`${DB}/trackers/${encodeURIComponent(code)}.json?ts=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error();const p=await r.json();if(!show(p)){$('#dot').className='dot';$('#statusText').textContent='Chưa có dữ liệu';$('#cloudStatus').className='notice warn';$('#cloudStatus').textContent='Không tìm thấy dữ liệu cho mã '+code;last=null;renderMarker();renderZones()}}catch{$('#dot').className='dot err';$('#statusText').textContent='Lỗi Firebase';$('#cloudStatus').className='notice err';$('#cloudStatus').textContent='Không đọc được Firebase.'}finally{busy=false}}function connect(){code=($('#shareCode').value.trim()||'HOME-01').replace(/[^A-Za-z0-9_-]/g,'-').slice(0,30);$('#shareCode').value=code;localStorage.setItem('cleanViewerCode',code);poll()}$('#connectBtn').onclick=connect;$('#shareCode').onkeydown=e=>{if(e.key==='Enter')connect()};$('#floorSeg').onclick=e=>{if(e.target.dataset.floor)setFloor(e.target.dataset.floor)};setFloor('ground');setInterval(poll,1000);poll();</script></body></html>
